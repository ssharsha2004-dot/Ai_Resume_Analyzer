{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
<div class="card app-card auth-card">
    <div class="card-body p-4 p-md-5">
        <h2 class="fw-bold">Create your account</h2>
        <p class="text-secondary">Start building a stronger resume.</p>
        <form method="post">
            <label class="form-label mt-3">Full Name</label>
            <input class="form-control" name="name" required>
            <label class="form-label mt-3">Email</label>
            <input class="form-control" type="email" name="email" required>
            <label class="form-label mt-3">Password</label>
            <input class="form-control" type="password" name="password" minlength="6" required>
            <button class="btn btn-primary w-100 mt-4">Create Account</button>
        </form>
        <p class="text-center mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</div>
</div>
{% endblock %}
