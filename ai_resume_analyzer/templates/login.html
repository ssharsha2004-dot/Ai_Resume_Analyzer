{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
<div class="card app-card auth-card">
    <div class="card-body p-4 p-md-5">
        <h2 class="fw-bold">Welcome back</h2>
        <p class="text-secondary">Login to continue analyzing your resume.</p>
        <form method="post">
            <label class="form-label mt-3">Email</label>
            <input class="form-control" type="email" name="email" required>
            <label class="form-label mt-3">Password</label>
            <input class="form-control" type="password" name="password" required>
            <button class="btn btn-primary w-100 mt-4">Login</button>
        </form>
        <p class="text-center mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</div>
</div>
{% endblock %}
